<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>Ryan Golf Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#1c2420;--sub:#6b756f;--line:#e3e7de;--g:#1f7a4d;--g2:#e6f3eb;--lime:#c6ef5e;--or:#ef8a25;--or2:#fdefe1;--teal:#2bb5a0;--bl:#3a5bc7;--bl2:#e8f0fd;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:6px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px;min-width:0}
header h1 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill{border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--g2);color:var(--g)}.pill.wait{background:#fff6d8;color:#8a6a00}.pill.off{background:#eceee9;color:#4e5751}
.pill.err{background:var(--or2);color:var(--or)}.pill.busy{background:var(--bl2);color:var(--bl)}
main{padding:4px 16px 110px;max-width:680px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:-.2px}
.card h3 small{font-weight:500;color:var(--sub);font-size:12px;display:block;margin-top:2px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.center{text-align:center}.muted{color:var(--sub)}.small{font-size:12px}
.icon{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
header .icon{background:#fff;font-size:17px}
.icon:disabled{opacity:.3}
.big{font-size:40px;font-weight:800;text-align:center;letter-spacing:-1px;margin:6px 0 2px;color:var(--g)}
.wkTot{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--g)}.days.sm{margin-top:10px;gap:4px}.days.sm .dbar{height:30px;border-radius:5px}.diffc{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg)}
.cpgoal{background:#e9f5ee;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#155c39}.cpgoal b{display:block;font-size:12px;margin-bottom:2px}.cues{margin:4px 0 0 32px;font-size:12px;color:var(--sub);line-height:1.5}.tgt{display:flex;align-items:center;gap:8px;margin:8px 0 2px 32px;font-size:13px}.tgt input{width:64px;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center}.tgt .tg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff4dc;color:#8a5a00}.tgt .tg.ok{background:#e3f4ea;color:#1f7a4d}.cpblk{border-top:1px solid var(--line);padding:2px 0 8px}.cpblk:first-of-type{border-top:0}.cpblk .todo{border-top:0}.cpday{font-size:12px;font-weight:800;margin:10px 0 4px;color:var(--g)}.cpprev{background:#fff;border-radius:12px;padding:10px;margin-top:8px;font-size:13px}.cpprev .row{gap:8px}
.todo{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.todo:first-of-type{border-top:0}.todo .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}.todo.ok .bx{background:var(--g);border-color:var(--g)}.todo.ok b{color:var(--sub);text-decoration:line-through}.todo .m{flex:1;min-width:0}.todo .m span{display:block;font-size:12px;color:var(--sub)}
.up{color:var(--g);font-weight:600}.down{color:var(--or);font-weight:600}
.days{display:flex;gap:6px;margin-top:16px}
.day{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.dbar{height:64px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.dbar i{display:block;width:100%;background:linear-gradient(var(--teal),var(--g));border-radius:8px 8px 0 0}
.day.today span{color:var(--g);font-weight:700}
.hbar{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.hbar .val{text-align:right;font-weight:600}
.track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:6px}
.track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;text-align:center}
.seg label{flex:1;padding:0;cursor:pointer;text-align:center;font-size:13px;font-weight:600;color:var(--sub)}
.seg .on,.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input{display:none}.seg label span{display:block;border-radius:9px;padding:8px 6px}
.headline{text-align:center;margin:4px 0 14px}
.headline b{font-size:34px;color:var(--or);letter-spacing:-1px}
.headline b.good{color:var(--g)}
.cmp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.cmp .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:8px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.bad{background:var(--or2);color:var(--or)}.badge.ok{background:var(--g2);color:var(--g)}
.cbar{display:grid;grid-template-columns:44px 1fr 54px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.cbar .v{text-align:right;font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);margin-top:4px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;position:relative}
.ic.p{background:var(--g2)}.ic.r{background:var(--bl2)}.ic.l{background:#fdf3dd}
.ic .pend{position:absolute;right:-4px;top:-4px;font-size:11px;background:#fff6d8;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m span{font-size:12px;color:var(--sub)}
.item .s{font-weight:800;font-size:16px;text-align:right}
.item .s small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--sub);margin-right:4px;vertical-align:1px}
.tag.t{background:var(--bl2);color:var(--bl)}.tag.pr{background:var(--g2);color:var(--g)}
.hw{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hw:first-of-type{border-top:0}
.hw input{width:20px;height:20px;margin-top:2px;accent-color:var(--g)}
.hw .m{flex:1}.hw .m span{font-size:12px;color:var(--sub);display:block}
.cnt{font-size:12px;font-weight:700;color:var(--g);background:var(--g2);padding:3px 8px;border-radius:999px;white-space:nowrap}
.addbtn{width:100%;border:0;background:var(--g);color:#fff;font-weight:700;padding:14px;border-radius:14px;font-size:15px;margin-bottom:12px;cursor:pointer}
.addbtn:disabled{opacity:.6}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:10.5px;color:var(--sub);font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.25}
nav button.on{color:var(--g)}
nav button .nd{position:absolute;top:4px;left:56%;width:8px;height:8px;border-radius:50%;background:var(--or)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;border-radius:20px 20px 0 0}
.sheet .hd b{flex:1;font-size:16px}
.sheet .bd{overflow:auto;padding:14px 16px;flex:1}
.sheet .ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;background:var(--g);color:#fff}
.btn.sec{background:var(--bg);color:var(--ink)}.btn.danger{background:var(--or2);color:var(--or);flex:none;padding:13px 16px}
.btn:disabled{opacity:.5}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.in,input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
.in:focus{border-color:var(--g)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec{font-size:13px;font-weight:800;margin:18px 0 8px;letter-spacing:-.2px}
.catrow{display:grid;grid-template-columns:1fr 74px 74px;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14px;font-weight:600}
.catrow input{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;width:100%;min-height:38px}
.colhd{display:grid;grid-template-columns:1fr 74px 74px;gap:8px;font-size:11px;color:var(--sub);text-align:center;padding:0 6px 4px 12px}
.colhd span:first-child{text-align:left}
.drow,.hrow{display:grid;gap:6px;align-items:center;background:#fff;border-radius:10px;padding:6px;margin-bottom:6px}
.drow{grid-template-columns:96px 1fr 50px 10px 50px 30px}
.hrow{grid-template-columns:24px 1fr 30px}
.drow input,.drow select,.hrow input{border:1px solid var(--line);border-radius:8px;padding:8px 6px;width:100%;min-height:38px;background:#fff}
.hrow .tg{grid-column:2/3}
.x{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer}
.ghost{border:1px dashed var(--g);color:var(--g);background:transparent;border-radius:10px;padding:10px;width:100%;font-weight:700;cursor:pointer}
.feel{display:flex;gap:8px}
.feel button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:22px;padding:6px 0;cursor:pointer;opacity:.5}
.feel button.on{opacity:1;border-color:var(--g);background:var(--g2)}
.check{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.check input{width:20px;height:20px;accent-color:var(--g)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dfe5dc;display:grid;place-items:center;cursor:pointer}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
.tile .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer}
.tile .lb{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(255,246,216,.95);color:#8a6a00;padding:2px 6px;border-radius:6px;pointer-events:none}
.addmedia{display:block;text-align:center;border:1px dashed var(--g);color:var(--g);border-radius:10px;padding:12px;font-weight:700;cursor:pointer;background:#fff}
.addmedia input{display:none}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.kv b{display:block;font-size:18px}.kv span{font-size:11px;color:var(--sub)}
.dtext{white-space:pre-wrap;background:#fff;border-radius:10px;padding:12px;margin-bottom:8px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba .cap{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.vframe{width:100%;aspect-ratio:9/16;border:0;border-radius:10px;background:#000;display:block}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer .vh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff}
.viewer .vh a{color:#cfe;font-size:13px}
.viewer .vb{flex:1;display:grid;place-items:center;padding:8px}
.viewer img,.viewer video{max-width:100%;max-height:82vh;border-radius:8px}
.viewer iframe{width:100%;height:82vh;border:0;border-radius:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.lock{max-width:360px;margin:10vh auto 0;text-align:center}
.lock .logo{font-size:52px}
.lock .in{margin-top:10px}
.err{color:var(--or);font-size:13px;min-height:18px;margin:8px 0}
.empty{text-align:center;color:var(--sub);padding:18px 0;font-size:14px}
table.rt{width:100%;border-collapse:collapse;font-size:12px}
table.rt th,table.rt td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
table.rt th{color:var(--sub);font-weight:600}
table.rt td:nth-child(2){text-align:left}
.linkbox{display:flex;gap:6px;margin-top:10px}
.linkbox input{flex:1;min-width:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.offbar{background:#eceee9;color:#4e5751;font-size:12px;text-align:center;padding:7px 12px;border-radius:10px;margin-bottom:10px}
/* AI 코치 */
.aihero{background:linear-gradient(135deg,#1f7a4d,#2bb5a0);color:#fff}
.aihero .muted{color:rgba(255,255,255,.8)}
.aihero h2{font-size:19px;line-height:1.35;margin:6px 0 8px;letter-spacing:-.3px}
.aihero p{margin:0;font-size:14px;color:rgba(255,255,255,.95)}
.ryan{background:#fffbea;border:1px solid #f3e3a1}
.ryan p{margin:6px 0 0;font-size:15px;font-weight:600}
.ul{margin:0;padding-left:18px}.ul li{margin:4px 0}
.gline{font-size:14px;margin:6px 0}.gline b{display:inline-block;font-size:11px;color:var(--sub);background:var(--bg);border-radius:6px;padding:1px 6px;margin-right:6px}
.drill{background:var(--g2);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.drill .small{margin-top:3px}
.vid{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;background:#fff}
.vid .yt{width:40px;height:28px;border-radius:8px;background:#e62117;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.vid b{display:block;font-size:14px}.vid .small{display:block}
.vid .go{margin-left:auto;color:var(--sub);font-size:18px}
.planrow{display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:9px 0}
.planrow .val{text-align:right;font-weight:700;font-size:12px}
.plantask{font-size:12px;color:var(--sub);margin:-4px 0 8px 104px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.hist:first-of-type{border-top:0}
.hist.on{color:var(--g);font-weight:700}
.teaser{display:flex;gap:12px;align-items:center;cursor:pointer}
.teaser .em{font-size:28px}
/* 퀘스트 */
.qcard{position:relative;border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;cursor:pointer;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#3d2d8f 0%,#1b1f4b 45%,#0f2a3a 100%);box-shadow:0 6px 20px rgba(27,31,75,.35)}
.qcard:after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(198,239,94,.35),transparent 70%)}
.qtop{display:flex;align-items:center;gap:8px;font-size:14px}
.flame{font-size:22px;filter:grayscale(1);opacity:.55}.flame.on{filter:none;opacity:1;animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1) rotate(-4deg)}100%{transform:scale(1.15) rotate(4deg)}}
.lvpill{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.xpbar{position:relative;height:16px;border-radius:999px;background:rgba(255,255,255,.15);margin:10px 0 4px;overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#c6ef5e,#2bd9a8);box-shadow:0 0 12px rgba(198,239,94,.7);transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.qhead{font-size:11px;font-weight:900;letter-spacing:1.5px;margin:12px 0 6px;color:#c6ef5e;text-transform:uppercase}
.perfect{color:#ffd23f;margin-left:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08);margin-bottom:6px;font-size:14px}
.qrow.done{background:rgba(198,239,94,.18)}.qrow.done .qt{text-decoration:line-through;opacity:.8}
.qrow .qi{font-size:18px}.qrow .qt{flex:1;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.qrow .qp{font-size:12px;font-weight:800;color:#c6ef5e;white-space:nowrap}
.qgo{margin-top:10px;text-align:center;font-weight:900;font-size:15px;background:#c6ef5e;color:#14261c;border-radius:12px;padding:11px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.qmini{display:flex;gap:12px;align-items:center;cursor:pointer;background:linear-gradient(135deg,#efeafd,#e6f3eb)}
.qgame{background:radial-gradient(130% 100% at 50% 0%,#2a2470 0%,#141938 60%,#0d1b29 100%);color:#fff;margin:-14px -16px;padding:16px;min-height:62vh}
.qdim{color:rgba(255,255,255,.65)}
.qhero{display:flex;gap:14px;align-items:center}
.lvbig{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#ffd23f,#ef8a25);box-shadow:0 0 18px rgba(255,210,63,.5)}
.lvtxt{font-weight:900;font-size:18px}
.wkstrip{display:flex;gap:4px;margin:14px 0 4px;align-items:center}
.wkstrip div{flex:1;text-align:center;background:rgba(255,255,255,.07);border-radius:10px;padding:4px 0;font-size:10px;color:rgba(255,255,255,.6)}

function t(k,o){let s=(T[S.lang]&&T[S.lang][k]);if(s==null)s=T.ko[k];if(s==null)s=esc(k);if(o)for(const x in o)s=s.split('{'+x+'}').join(o[x]);return s}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function pd(s){const a=String(s||'').split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function inR(s,a,b){const d=pd(s);return d>=a&&d<=b}
function fmtMin(m){m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;if(S.lang==='ko')return h?h+'시간'+(r?' '+r+'분':''):r+'분';return h?h+'h'+(r?' '+r+'m':''):r+'m'}
function fmtD(s){const d=pd(s);const w=S.lang==='ko'?'일월화수목금토'[d.getDay()]:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];return S.lang==='ko'?(d.getMonth()+1)+'/'+d.getDate()+' ('+w+')':w+' '+(d.getMonth()+1)+'/'+d.getDate()}
function fmtS(d){return (d.getMonth()+1)+'/'+d.getDate()}
function fmtTime(iso){if(!iso)return t('never');const d=new Date(iso);return fmtS(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function signed(v,dec){if(v==null)return '–';const s=Math.abs(v).toFixed(dec==null?1:dec);return (v>0?'+':v<0?'−':'±')+s}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function pMin(p){return (p.items||[]).reduce((a,i)=>a+(+i.min||0),0)}
function sumMin(l){return l.reduce((a,p)=>a+pMin(p),0)}
function catTot(l){const o={};CATS.forEach(c=>o[c]=0);l.forEach(p=>(p.items||[]).forEach(i=>{if(o[i.cat]!=null)o[i.cat]+=(+i.min||0)}));return o}

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ryan-golf-log',1);
  r.onupgradeneeded=()=>{const d=r.result;['recs','media','kv'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function rq(store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const st=tx.objectStore(store);let out;const r=fn(st);
  if(r&&typeof r==='object'&&'onsuccess' in r)r.onsuccess=()=>{out=r.result};
  tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'))})}
const idb={
  get:(s,k)=>rq(s,'readonly',st=>st.get(k)),
  put:(s,k,v)=>rq(s,'readwrite',st=>st.put(v,k)),
  del:(s,k)=>rq(s,'readwrite',st=>st.delete(k)),
  entries:s=>new Promise((res,rej)=>{const out=[];const tx=db.transaction(s);const c=tx.objectStore(s).openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}),
  batch:(s,ops)=>rq(s,'readwrite',st=>{ops.forEach(o=>o[0]==='put'?st.put(o[2],o[1]):st.delete(o[1]))})
};

async function gcMedia(){
  const used=new Set();(await idb.entries('recs')).forEach(([k,x])=>refs(x.rec).forEach(m=>{if(m.local)used.add(m.local)}));
  (await idb.entries('recs')).forEach(([k,x])=>{if(x.dirty)refs(x.rec).forEach(m=>{if(m.local)used.add(m.local)})});
  if(F)Object.values(F.media).forEach(l=>l.forEach(m=>{if(m.local)used.add(m.local)}));
  const old=Date.now()-3600e3;
  const ops=(await idb.entries('media')).filter(([k,m])=>!used.has(k)&&(m.driveId||(m.created||0)<old)).map(([k])=>['del',k]);
  if(ops.length)await idb.batch('media',ops);
  const now=Date.now(),kv=(await idb.entries('kv')).filter(([k,v])=>/^img:/.test(k)&&v&&(now-(v.t||0))>(/:v$/.test(k)?7:30)*864e5).map(([k])=>['del',k]);
  if(kv.length)await idb.batch('kv',kv);
}

async function call(action,payload,timeout){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeout||120000);
  let r,j;
  try{
    r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({key:cfg.key,action,payload:payload||{}}),signal:ctrl.signal,redirect:'follow'});
    j=await r.json();
  }catch(e){throw new Error(e&&e.name==='AbortError'?'timeout':(r?'bad response ('+r.status+')':'network'))}
  finally{clearTimeout(to)}
  if(!j||!j.ok){const m=(j&&j.error)||'error';if(m==='AUTH'&&S.mode==='app'&&action!=='ping')setTimeout(onAuthFail,0);throw new Error(m)}
  return j.data;
}

async function uploadLocal(lid){
  const map=(await idb.get('kv','mediaMap'))||{};
  if(map[lid])return map[lid];
  const m=await idb.get('media',lid);
  if(!m||!m.blob)return null; // 이미 지워진 사진 → 빼고 진행
  if(m.driveId)return m.driveFile;
  const blob=m.blob,total=blob.size;
  const finish=async f=>{m.driveId=f.id;m.driveFile=f;await idb.put('media',lid,m);const mp=(await idb.get('kv','mediaMap'))||{};mp[lid]=f;await idb.put('kv','mediaMap',mp);return f};
  if(m.session){
    const s=await call('uploadStatus',{session:m.session,total});
    if(s.done)return finish(s.file);
    if(s.expired){m.session=null;m.offset=0}else m.offset=s.next||0;
  }
  if(!m.session){
    let st;try{st=await call('uploadStart',{name:m.name,mimeType:m.mime,size:total})}
    catch(e){const em=String(e&&e.message||e);if(/너무 커요|사진·영상만/.test(em))return null;throw e} // 올릴 수 없는 파일은 빼고 진행
    m.session=st.session;m.offset=0;await idb.put('media',lid,m)}
  for(let guard=0;guard<10000;guard++){
    const part=blob.slice(m.offset,m.offset+CHUNK);
    const b64=await toB64(part);
    const r=await call('uploadChunk',{session:m.session,start:m.offset,total,data:b64,mimeType:m.mime},180000);
    if(r.done)return finish(r.file);
    if(r.expired){m.session=null;m.offset=0;await idb.put('media',lid,m);return uploadLocal(lid)}
    m.offset=r.next;await idb.put('media',lid,m);
    S.upProg=Math.round(m.offset/total*100)+'%';renderHdr();
  }
  throw new Error('upload loop');
}
async function sync(manual){
  if(S.syncing||!cfg.url||!cfg.key||S.mode!=='app')return;
  if(!online()){if(manual)toast(t('needOnline'));renderHdr();return}
  S.syncing=true;S.syncErr='';renderHdr();
  try{
    // 1) 폰에 쌓인 기록 올리기 (사진·영상 먼저)
    const errs={};let lost=0;
    for(const [key,it] of await idb.entries('recs')){
      if(!it.dirty)continue;
      try{
        const r=JSON.parse(JSON.stringify(it.rec));
        for(const g of ['media','before','after']){
          if(!Array.isArray(r[g]))continue;
          const out=[];
          for(const m of r[g]){if(m&&m.local){const f=await uploadLocal(m.local);if(f)out.push({id:f.id,name:f.name,mime:f.mime});else lost++}else if(m)out.push(m)}
          r[g]=out;
        }
        S.upProg='';
        delete r._lv;
        const saved=await call('save',{type:it.type,record:r});
        const cur=await idb.get('recs',key);
        if(!cur||cur.rec._lv!==it.rec._lv)continue; // 올리는 사이 수정/삭제됨 → 다음 동기화에 반영
        await idb.put('recs',key,{type:it.type,rec:saved,dirty:false});
      }catch(e){
        const m=String(e&&e.message||e);
        if(m==='network'||m==='timeout'||m==='AUTH'||m==='LOCKED')throw e;
        if(m==='FORBIDDEN'||m==='Bad id'||m==='Bad save'){const cur=await idb.get('recs',key);if(cur){cur.dirty=false;await idb.put('recs',key,cur)}}
        errs[key]=m; // 이 기록만 건너뛰고 계속
      }
    }
    S.itemErrs=errs;if(lost)toast(t('mediaLost',{n:lost}));
    // 2) 삭제 반영 (하나씩, 실패해도 계속)
    for(const x of ((await idb.get('kv','deletes'))||[])){
      try{await call('remove',x)}catch(e){const m=String(e&&e.message||e);if(m==='network'||m==='timeout'||m==='AUTH'||m==='LOCKED')throw e}
      const left=((await idb.get('kv','deletes'))||[]).filter(y=>!(y.type===x.type&&y.id===x.id));await idb.put('kv','deletes',left);
    }
    // 3) 기다리는 질문 보내기
    await sendAsks(manual);
    // 4) 서버 기록 내려받기
    const d=await call('load',{rev:Object.keys(S.itemErrs||{}).length?'':(ls('rev')||'')});
    if(d.same&&Array.isArray(d.gcal))await idb.put('kv','gcal',d.gcal.filter(x=>x&&ID_RE.test(String(x.id||''))));
    if(!d.same){
    if(d.player){S.player=d.player;ls('player',d.player)}
    if(d.role){ls('role',d.role);S.role=d.role;S.who=d.role==='kid'?'ryan':'mom'}
    if(d.usage)await idb.put('kv','usage',d.usage);
    const okId=x=>x&&ID_RE.test(String(x.id||''));
    TYPES.forEach(tp=>{if(Array.isArray(d[tp]))d[tp]=d[tp].filter(okId)});
    ['chats','analyses','gcal'].forEach(k=>{if(Array.isArray(d[k]))d[k]=d[k].filter(okId)});
    const loc=new Map(await idb.entries('recs'));
    const delSet=new Set(((await idb.get('kv','deletes'))||[]).map(x=>x.type+':'+x.id));
    const seen=new Set(),ops=[];
    TYPES.forEach(tp=>(d[tp]||[]).forEach(sr=>{const k=tp+':'+sr.id;seen.add(k);const l=loc.get(k);
      if(delSet.has(k)||(l&&l.dirty))return;ops.push(['put',k,{type:tp,rec:sr,dirty:false}])}));
    loc.forEach((v,k)=>{if(!seen.has(k)&&!v.dirty)ops.push(['del',k])});
    await idb.batch('recs',ops);
    if(Array.isArray(d.chats))await idb.put('kv','chats',d.chats);
    if(Array.isArray(d.gcal))await idb.put('kv','gcal',d.gcal);
    if(Array.isArray(d.analyses)){
      const prevTop=(S.analyses[0]||{}).id;
      await idb.put('kv','analyses',d.analyses);
      if(d.analyses[0]&&d.analyses[0].id!==prevTop&&prevTop)toast('🤖 '+t('aiDone'));
    }
    if(d.rev!=null)ls('rev',String(d.rev));
    }
    ls('lastSync',new Date().toISOString());
    await gcMedia();
  }catch(e){
    S.syncErr=String(e&&e.message||e);
    if(S.syncErr==='AUTH'||S.syncErr==='LOCKED')S.syncErr=errMsg(e);
    if(manual)toast(t('syncErr')+': '+S.syncErr);
  }
  S.syncing=false;S.upProg='';
  await reloadMem();await refreshDirty();
  if(online()&&S.chatPend.some(x=>!x.err))setTimeout(()=>sync(),400);
  if(document.getElementById('sheetBg').classList.contains('open')){renderHdr();if(SHEET==='settings'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))openSettings()}
  else render();
}

    return `<section class="card"><h3>🏆 ${t('offT')}<small>${fmtD(td)}</small></h3>${ev.map(e=>evRow(e,true)).join('')}<div class="small muted">${t('offS')}</div></section>`}
  const td=today(),tp=S.data.practice.filter(p=>p.date===td),ct=catTot(tp);
  const cl=activeCoach(td),cb=cl?coachBlocks(cl,td):[];
  const plan=[];if(!cb.length)allEvents().filter(e=>e.kind==='plan'&&e.date===td).forEach(e=>(e.items||[]).forEach(i=>{if(CC[i.cat])plan.push(i)}));
  const hwDone=new Set();tp.forEach(p=>(p.homework||[]).forEach(id=>hwDone.add(id)));
  const qr=todayQ();if(qr){(qr.hwDone||[]).forEach(id=>hwDone.add(id));(qr.items||[]).forEach(q=>{if(q.src==='hw'&&q.done)hwDone.add(String(q.qid).slice(3))})}
  const rows=plan.map(i=>{const m=+i.minutes||0,d=ct[i.cat]||0,ok=m>0&&d>=m;
    return `<div class="todo ${ok?'ok':''}" onclick="openForm('practice',null,{date:'${td}'})"><span class="bx">${ok?'✓':''}</span><div class="m"><b><i class="dot" style="background:${CC[i.cat]}"></i>${t('c_'+i.cat)} ${fmtMin(m)}</b><span>${t('tagPlan')}${i.task?' · '+esc(L(i.task)):''}${d&&!ok?' · '+t('ofPlan',{a:Math.round(d),b:m}):''}</span></div></div>`});
  openHw().forEach(({l,h})=>{const ok=hwDone.has(h.id);
    rows.push(`<div class="todo ${ok?'ok':''}" onclick="tapHw('${ID_RE.test(h.id)?h.id:''}')"><span class="bx">${ok?'✓':''}</span><div class="m"><b>${esc(h.text)}</b><span>${t('tagHw')}${h.target?' · '+esc(h.target):''}${ok?' · '+t('didToday'):''}</span></div></div>`)});
  const dl=fmtD(td);
  let top='';
  if(cl){const g=(cl.plan.goals||[]).map(x=>esc(L(x))).join(' · ');if(g)top=`<div class="cpgoal"><b>🎓 ${t('cpGoals')}${cl.coach?' · '+esc(cl.coach):''}</b>${g}</div>`}
  let cbh='';
  if(cb.length){const st=coachState(td),dn=cb.filter(b=>(st[cl.id+'.'+b.id]||{}).done).length;
    cbh=`<div class="row between" style="margin:2px 0 4px"><b class="small">🎓 ${t('cpFrom')}</b><span class="small muted">${t('cpBlocks',{a:dn,b:cb.length})}</span></div>`+cb.map(b=>cpBlockRow(cl,b,st)).join('');
    if(cl.plan.note)cbh+=`<div class="small muted center" style="margin-top:8px">“${esc(L(cl.plan.note))}”</div>`}
  const all=cbh+(rows.length&&cbh?'<div style="height:6px"></div>':'')+rows.join('');
  return `<section class="card"><h3>✅ ${t('todayTodo')}<small>${dl}</small></h3>${top}${all||`<div class="small muted">${t('todoEmpty')}</div>`}</section>`;
}

/* ===== 선생님 주간 숙제 ===== */
const WDK=['mon','tue','wed','thu','fri','sat','sun'];
function wdKey(d){return WDK[(pd(d).getDay()+6)%7]}
function activeCoach(date){return S.data.lessons.filter(l=>l.plan&&l.plan.days&&l.date<date).sort(byDateDesc)[0]||null}
function coachBlocks(l,date){return ((l.plan.days||{})[wdKey(date)]||[]).filter(b=>b&&ID_RE.test(String(b.id||'')))}
function coachRecs(date){return S.data.practice.filter(p=>p.date===date&&p.coach)}
function coachState(date){const st={};coachRecs(date).forEach(p=>Object.entries(p.coach).forEach(([k,c])=>{if(!c)return;const o=st[k]||(st[k]={});if(c.done)o.done=true;if(c.val!=null)o.val=Math.max(o.val??-1,+c.val)}));return st}
function cpGoalOk(tg,v){if(v==null||!tg)return false;if(tg.type==='ratio')return v>=(tg.goal||tg.n);return tg.goal?v>=tg.goal:false}
function coachXP(c){if(!c)return 0;let x=c.done?40:0;if(c.val!=null)x+=c.ok?30:10;return x}
function coachXPAll(){let x=0;S.data.practice.forEach(p=>{if(p.coach)Object.values(p.coach).forEach(c=>x+=coachXP(c))});return x}
function cpBlockRow(l,b,st){
  const k=l.id+'.'+b.id,c=st[k]||{},ok=!!c.done,tg=b.target;
  const cues=(b.cues||[]).map(x=>'· '+esc(L(x))).join('<br>');
  let tgh='';
  if(tg){const v=c.val,gok=cpGoalOk(tg,v);
    const lab=tg.type==='ratio'?t('cpSucc'):tg.type==='streak'?t('cpStreak'):t('cpCount');
    const goal=tg.type==='ratio'?`${t('cpGoalL')} ${tg.goal||tg.n}/${tg.n}`:tg.goal?`${t('cpGoalL')} ${tg.goal}`:'';
    tgh=`<div class="small" style="margin:6px 0 0 32px;color:var(--sub)">🎯 ${esc(L(tg.label))}</div><div class="tgt"><span>${lab}</span><input type="number" inputmode="numeric" min="0" max="${tg.n||999}" value="${v??''}" onchange="cpVal('${l.id}','${b.id}',this.value)" onclick="event.stopPropagation()">${tg.type==='ratio'?`<span>/ ${tg.n}</span>`:''}${goal?`<span class="tg ${gok?'ok':''}">${gok?'✓ ':''}${goal}</span>`:''}</div>`}
  return `<div class="cpblk"><div class="todo ${ok?'ok':''}" onclick="cpTap('${l.id}','${b.id}')"><span class="bx">${ok?'✓':''}</span><div class="m"><b><i class="dot" style="background:${CC[b.cat]||'#999'}"></i>${esc(L(b.title))} ${b.minutes?fmtMin(b.minutes):''}</b></div></div>${cues?`<div class="cues">${cues}</div>`:''}${tgh}</div>`;
}
function myCoachRec(date){
  const id='coach_'+date.replace(/-/g,'')+'_'+(S.who==='mom'?'mom':'ryan');
  let r=S.data.practice.find(p=>p.id===id);
  if(!r)r={id,date,by:S.who,items:[],drills:[],homework:[],location:'',notes:'',feel:null,media:[],coach:{}};
  else r=JSON.parse(JSON.stringify(r));
  r.coach=r.coach||{};r.items=r.items||[];return r;
}
async function cpXP(fn){
  const xp0=totalXP(),lv0=lvlOf(xp0),b0=new Set(badges().filter(x=>x.got).map(x=>x.id));
  await fn();
  const gain=totalXP()-xp0,lv1=lvlOf(totalXP()),nb=badges().filter(x=>x.got&&!b0.has(x.id));
  return {gain,lv0,lv1,nb};
}
function cpCelebrate(big,lines,res){
  if(!res||res.gain<=0){render();sync();return}
  celebrate(big,'+'+res.gain+' XP',lines,()=>{
    const next=()=>{if(res.nb.length){const x=res.nb.shift();celebrate('🏅 '+t('qNewBadge'),x.i+' '+L(x.n),[L(x.d)],next,'badge')}else{render();sync()}};
    if(res.lv1>res.lv0)celebrate('LEVEL UP!','Lv.'+res.lv1+' '+lvlName(res.lv1),[t('qLevelMsg')],next,'level');else next();
  });
}
async function cpTap(lid,bid){
  const td=today(),l=S.data.lessons.find(x=>x.id===lid);if(!l)return;
  const b=coachBlocks(l,td).find(x=>x.id===bid);if(!b)return;
  const k=lid+'.'+bid,st=coachState(td);
  const r=myCoachRec(td),c=r.coach[k]||{};
  const addMin=(m)=>{if(!b.minutes||!CC[b.cat])return;let it=r.items.find(i=>i.cat===b.cat);if(!it){it={cat:b.cat,min:0,balls:null};r.items.push(it)}it.min=Math.max(0,(+it.min||0)+m);r.items=r.items.filter(i=>i.min>0)};
  if(st[k]&&st[k].done&&!c.done){toast(t('didToday'));return}
  if(c.done){c.done=false;addMin(-b.minutes);r.coach[k]=c;await saveLocal('practice',r);render();sync();return}
  c.done=true;addMin(b.minutes);r.coach[k]=c;sfx('tick');vib(15);
  const res=await cpXP(()=>saveLocal('practice',r));
  cpCelebrate(t('cpClear'),['🎓 '+L(b.title)+(b.minutes?' · '+fmtMin(b.minutes):'')],res);
}
async function cpVal(lid,bid,v){
  const td=today(),l=S.data.lessons.find(x=>x.id===lid);if(!l)return;
  const b=coachBlocks(l,td).find(x=>x.id===bid);if(!b||!b.target)return;
  const tg=b.target,k=lid+'.'+bid,r=myCoachRec(td),c=r.coach[k]||{};
  if(v===''||v==null){delete c.val;delete c.ok;r.coach[k]=c;await saveLocal('practice',r);render();sync();return}
  let n=Math.max(0,Math.min(Math.round(+v)||0,tg.n||999));
  const prevBest=Math.max(-1,...S.data.practice.filter(p=>p.coach&&p.date<td).flatMap(p=>Object.entries(p.coach).filter(([kk,cc])=>cc&&cc.val!=null&&kk.split('.')[1]&&cc.label===L(tg.label)).map(([,cc])=>+cc.val)));
  const wasOk=!!c.ok;c.val=n;c.n=tg.n||null;c.goal=tg.goal||null;c.type=tg.type;c.label=L(tg.label);c.ok=cpGoalOk(tg,n);r.coach[k]=c;
  const res=await cpXP(()=>saveLocal('practice',r));
  if(c.ok&&!wasOk)return cpCelebrate(t('cpGoal'),['🎯 '+L(tg.label)+' · '+n+(tg.n?'/'+tg.n:'')],res);
  if(tg.type==='streak'&&!tg.goal&&prevBest>=0&&n>prevBest)return cpCelebrate(t('cpBest'),['🔥 '+L(tg.label)+' · '+n],res);
  toast(t('saved'));render();sync();
}
/* 레슨 입력: 선생님 글 → AI 정리 */
async function cpParse(){

  if(!text){toast(t('cpPaste'));return}if(!online()){toast(t('needOnline'));return}

  catch(e){toast(errMsg(e))}
  finally{btn.disabled=false;btn.textContent=t('cpAI')}

function cpDelBlock(d,i){if(!F.plan)return;F.plan.days[d].splice(i,1);drawCpPrev()}
function drawCpPrev(){
  const el=document.getElementById('cpPrev');if(!el)return;const p=F.plan;
  if(!p){el.innerHTML=`<div class="note">${t('cpNone')}</div>`;return}
  const dn=t('days');const info=F.cpInfo||{};
  const ld=(document.querySelector('#frm [name=date]')||{}).value||today();

  if(p.goals&&p.goals.length)h+=`<div class="cpgoal" style="margin-top:8px"><b>${t('cpGoals')}</b>${p.goals.map(g=>esc(L(g))).join(' · ')}</div>`;
  WDK.forEach((d,di)=>{const bs=(p.days||{})[d]||[];if(!bs.length)return;
    h+=`<div class="cpday">${dn[di]} · ${fmtMin(bs.reduce((a,b)=>a+(+b.minutes||0),0))}</div>`+bs.map((b,i)=>`<div class="row between" style="padding:4px 0;border-top:1px solid var(--line)"><div style="flex:1;min-width:0"><b><i class="dot" style="background:${CC[b.cat]||'#999'}"></i>${esc(L(b.title))} ${b.minutes?fmtMin(b.minutes):''}</b>${b.target?`<div class="small" style="color:#8a5a00">🎯 ${esc(L(b.target.label))}${b.target.type==='ratio'?` · ${b.target.goal||b.target.n}/${b.target.n}`:b.target.goal?' · '+b.target.goal:''}</div>`:''}<div class="small muted">${(b.cues||[]).map(c=>esc(L(c))).join(' · ')}</div></div><button type="button" class="icon" onclick="cpDelBlock('${d}',${i})">×</button></div>`).join('')});
  if(p.note)h+=`<div class="small muted" style="margin-top:8px">“${esc(L(p.note))}”</div>`;
  if(info.unclear&&info.unclear.length)h+=`<div class="note">⚠️ ${t('cpUnclear')}: ${info.unclear.map(esc).join(' / ')}</div>`;
  if(info.translated===false)h+=`<div class="note">${t('cpNoTr')}</div>`;
  h+=`<button type="button" class="chip" style="margin-top:8px" onclick="F.plan=null;F.cpInfo=null;drawCpPrev()">🗑 ${t('cpDel')}</button></div>`;
  el.innerHTML=h;
}
/* 리포트: 기간 안 선생님 숙제 결과 */
function cpReport(a,b){
  const ps=S.data.practice.filter(p=>p.coach&&inR(p.date,a,b));
  const tg={};let done=0;
  ps.forEach(p=>Object.entries(p.coach).forEach(([k,c])=>{if(!c)return;if(c.done)done++;if(c.val!=null&&c.label){const o=tg[c.label]||(tg[c.label]={type:c.type,n:c.n,goal:c.goal,rows:[]});o.rows.push({date:p.date,val:+c.val,ok:!!c.ok})}}));
  let planned=0;for(let d=pd(a);ymd(d)<=b&&ymd(d)<=today();d=addDays(d,1)){const l=activeCoach(ymd(d));if(l)planned+=coachBlocks(l,ymd(d)).length}
  return {done,planned,targets:Object.entries(tg).map(([label,o])=>{o.label=label;o.rows.sort((x,y)=>x.date.localeCompare(y.date));
    if(o.type==='ratio'){const m=o.rows.reduce((s,r)=>s+r.val,0),n=o.rows.length*(o.n||1);o.sum=Math.round(m/n*100)+'%'}else o.sum=t('cpStreak')+' '+Math.max(...o.rows.map(r=>r.val));return o})};
}
function cpReportCard(a,b){
  const c=cpReport(a,b);if(!c.planned&&!c.targets.length)return '';
  return `<section class="card"><h3>🎓 ${t('cpReport')}</h3><div class="small">${t('cpDone')}: <b>${c.planned?c.done+' / '+c.planned:c.done}</b></div>${c.targets.map(o=>`<div style="padding:8px 0;border-top:1px solid var(--line);margin-top:6px"><div class="row between"><b class="small">🎯 ${esc(o.label)}${o.type==='ratio'?` (${o.goal||o.n}/${o.n})`:''}</b><span class="small up">${esc(o.sum)}</span></div><div class="small muted">${o.rows.map(r=>`${fmtS(pd(r.date))} ${r.val}${o.n&&o.type==='ratio'?'/'+o.n:''}${r.ok?' ✓':''}`).join(' · ')}</div></div>`).join('')}</section>`;
}
/* 숙제 한 번 누르면 오늘 완료 (다시 누르면 취소). 오늘 퀘스트에 같은 숙제가 있으면 퀘스트도 클리어 */
async function tapHw(id){
  if(!id)return;
  const r=todayQ();
  if(!r){openForm('practice',null,{date:today(),homework:[id]});return}
  const q=(r.items||[]).find(x=>x.qid==='hw_'+id);
  if(q&&q.done){toast(t('didToday'));return}
  const l=r.hwDone||(r.hwDone=[]);const i=l.indexOf(id);
  if(i>=0){l.splice(i,1);await saveLocal('quests',r);render();sync();return}
  l.push(id);sfx('tick');vib(15);
  if(q)return completeQuest(q);
  await saveLocal('quests',r);render();sync();
}
/* ----- 연습 vs 시합 ----- */
function agg(rs){
  const o={n:rs.length};
  const acc=(k,f)=>{const v=rs.map(f).filter(x=>x!=null&&isFinite(x));o[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  acc('toPar',r=>r.score!=null&&r.par!=null?(r.score-r.par)*18/r.holes:null);
  acc('putts',r=>r.putts!=null?r.putts*18/r.holes:null);
  acc('gir',r=>r.gir!=null?r.gir/r.holes*100:null);
  acc('fw',r=>r.fairways!=null&&r.fwHoles?r.fairways/r.fwHoles*100:null);
  acc('tp',r=>r.threePutts!=null?r.threePutts*18/r.holes:null);
  return o;
}
function rangeStart(k){const n=new Date();if(k==='year')return new Date(n.getFullYear(),0,1);if(k==='d90')return addDays(n,-90);return new Date(2000,0,1)}
function cmpCard(range,tabs,from,to){
  const a=from||rangeStart(range),b=to||new Date(2100,0,1);
  const rs=S.data.rounds.filter(r=>r.finished!==false&&r.holes&&inR(r.date,a,b));
  const P=agg(rs.filter(r=>r.kind!=='tournament')),Tn=agg(rs.filter(r=>r.kind==='tournament'));
  const head=`<h3>${t('compare')}<small>${t('cmpSub')}</small></h3>`+(tabs?`<div class="seg">${['year','d90','all'].map(k=>`<button class="${S.cmp===k?'on':''}" onclick="S.cmp='${k}';render()">${t(k)}</button>`).join('')}</div>`:'');
  if(!P.n||!Tn.n)return `<section class="card">${head}<div class="empty">${t('needMore')}<br><span class="small">${t('roundsN',{a:P.n,b:Tn.n})}</span></div></section>`;
  const rows=[
    {k:'toPar',l:t('toPar'),lo:true,f:v=>signed(v)},
    {k:'putts',l:t('putts18'),lo:true,f:v=>v.toFixed(1)},
    {k:'gir',l:t('gir'),lo:false,f:v=>Math.round(v)+'%',pct:true},
    {k:'tp',l:t('tp18'),lo:true,f:v=>v.toFixed(1)},
    {k:'fw',l:t('fw'),lo:false,f:v=>Math.round(v)+'%',pct:true}
  ].filter(x=>P[x.k]!=null&&Tn[x.k]!=null);
  const d0=(Tn.toPar!=null&&P.toPar!=null)?Tn.toPar-P.toPar:null;
  rows.forEach(x=>{x.d=Tn[x.k]-P[x.k];x.bad=x.lo?x.d>0.05:x.d<-0.5});
  const maxK=rows.filter(x=>x.k!=='toPar'&&x.bad).reduce((m,x)=>{const v=Math.abs(x.d)/(Math.abs(P[x.k])||1);return v>m.v?{k:x.k,v}:m},{k:null,v:0}).k;
  return `<section class="card">${head}
   ${d0!=null?`<div class="headline"><div class="small muted">${t('inTourn')}</div><b class="${d0<=0?'good':''}">${signed(d0)}${t('stroke')}</b></div>`:''}
   <div class="legend"><span><i class="dot" style="background:var(--teal)"></i>${t('pr')} ${P.n}</span><span><i class="dot" style="background:var(--or)"></i>${t('tn')} ${Tn.n}</span></div>
   ${rows.map(x=>{const m=Math.max(Math.abs(P[x.k]),Math.abs(Tn[x.k]),0.1);

/* ================= 사진·영상 표시 ================= */
const LURL=new Map(),DURL=new Map(),DQ=[];let DACT=0;
async function hydrate(root){
  for(const el of root.querySelectorAll('[data-local]')){
    if(el.getAttribute('src'))continue;
    const lid=el.dataset.local;let u=LURL.get(lid);
    if(!u){const m=await idb.get('media',lid);if(!m||!m.blob)continue;u=URL.createObjectURL(m.blob);LURL.set(lid,u)}
    el.src=u;
  }
  for(const el of root.querySelectorAll('[data-drive]')){
    if(el.getAttribute('src'))continue;
    driveUrl(el.dataset.drive,el.dataset.sz||'s').then(u=>{if(u)el.src=u}).catch(()=>{});
  }
}
// 비공개 Drive 사진은 서버를 통해서 받아 폰에 보관
function driveUrl(id,sz){
  if(!ID_RE.test(String(id)))return Promise.resolve(null);
  const k=id+':'+sz;if(DURL.has(k))return DURL.get(k);
  const pr=(async()=>{
    const c=await idb.get('kv','img:'+k);if(c&&c.blob)return URL.createObjectURL(c.blob);
    if(!online())return null;
    await new Promise(r=>{if(DACT<3){DACT++;r()}else DQ.push(r)});
    try{
      const r=await call('media',{id,size:sz},120000);
      if(!r||!r.data)return null;
      const bin=atob(r.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const blob=new Blob([u8],{type:r.mime||'image/jpeg'});
      if(sz!=='v'||blob.size<30e6)await idb.put('kv','img:'+k,{blob,t:Date.now()});
      return URL.createObjectURL(blob);
    }finally{DACT--;const n=DQ.shift();if(n){DACT++;n()}}
  })();
  pr.then(u=>{if(!u)DURL.delete(k)},()=>DURL.delete(k));
  DURL.set(k,pr);return pr;
}
function driveLink(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
function mAttr(m){return esc(JSON.stringify(m))}
function tileInner(m,w){
  if(m.local)return (isVid(m)?`<video data-local="${m.local}" muted playsinline preload="metadata"></video><div class="play">▶</div>`:`<img data-local="${m.local}" alt="">`)+`<span class="lb">⏳ ${t('waitUp')}</span>`;
  if(!ID_RE.test(String(m.id||'')))return '';
  return `<img data-drive="${m.id}" data-sz="s" alt="">${isVid(m)?'<div class="play">▶</div>':''}`;
}
function mediaGrid(list){
  if(!list||!list.length)return '';
  return `<div class="mg">${list.map(m=>`<div class="tile" data-m="${mAttr(m)}" onclick="viewMedia(this)">${tileInner(m,400)}</div>`).join('')}</div>`;
}
function mediaFrame(m){
  if(m.local)return isVid(m)?`<video class="vframe" controls playsinline data-local="${m.local}"></video>`:`<img data-local="${m.local}" style="width:100%;border-radius:10px" alt="">`;
  if(!ID_RE.test(String(m.id||'')))return '';
  return isVid(m)?`<div class="tile" style="aspect-ratio:9/16" data-m="${mAttr(m)}" onclick="viewMedia(this)"><img data-drive="${m.id}" data-sz="s" alt=""><div class="play">▶</div></div>`
    :`<img data-drive="${m.id}" data-sz="l" style="width:100%;border-radius:10px" alt="" data-m="${mAttr(m)}" onclick="viewMedia(this)">`;
}
function viewMedia(el){
  const m=JSON.parse(el.dataset.m);const vo=document.getElementById('vOpen'),vb=document.getElementById('vBody');
  if(m.local){vo.removeAttribute('href');vo.textContent='📱 '+t('waitUp');
    vb.innerHTML=isVid(m)?`<video controls autoplay playsinline data-local="${m.local}"></video>`:`<img data-local="${m.local}" alt="">`;hydrate(vb)}
  else{if(!ID_RE.test(String(m.id||'')))return;
    vo.href=driveLink(m.id);vo.textContent=t('openDrive')+' ↗';
    if(isVid(m)){vb.innerHTML=`<div class="center" style="color:#fff"><span class="spin"></span></div>`;
      driveUrl(m.id,'v').then(u=>{if(!document.getElementById('viewer').classList.contains('open'))return;
        vb.innerHTML=u?`<video controls autoplay playsinline src="${u}"></video>`:`<div class="center" style="color:#fff">${t('tooBigVid')}<a class="vlink" style="color:#cfe" href="${driveLink(m.id)}" target="_blank" rel="noopener">${t('openDrive')} ↗</a></div>`})
        .catch(()=>{vb.innerHTML=`<div class="center" style="color:#fff">${t('tooBigVid')}</div>`})}
    else{vb.innerHTML=`<img data-drive="${m.id}" data-sz="l" alt="">`;hydrate(vb)}}
  document.getElementById('viewer').classList.add('open');
}

function fileMime(f){if(f.type)return f.type;const e=(f.name||'').split('.').pop().toLowerCase();
  return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp',mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4','3gp':'video/3gpp',webm:'video/webm'}[e]||''}
async function pickMedia(input,g){
  const all=[...input.files];input.value='';const form=F;
  const files=all.filter(f=>/^(image|video)\//.test(fileMime(f))&&f.size<=600*1024*1024);
  if(files.length<all.length)toast(t('badFile'));
  const btn=document.getElementById('saveBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
  for(const f of files){
    let blob=f,mime=fileMime(f),name=f.name||'file';
    if(/^image\/(jpeg|png|webp)/.test(mime)){const b=await shrinkImage(f);if(b!==f){blob=b;mime='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg'}}
    const lid='lm_'+uid();
    try{await idb.put('media',lid,{blob,mime,name:today()+'_'+name,size:blob.size,created:Date.now()});form.media[g].push({local:lid,mime,name})}
    catch(e){toast(t('err')+': '+(e&&e.message||e))}
    if(F===form)drawMedia(g);
  }
  if(btn&&F===form){btn.disabled=false;btn.textContent=t('save')}
}
function shrinkImage(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const max=2000,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b&&b.size<file.size?b:file),'image/jpeg',0.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url;
  });
}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}

    const hs=(F.holes||[]).map(h=>({n:h.n,par:h.par,pen:+h.pen||0,sc:h.shots.length?null:(h.sc!=null?h.sc:null),pt:h.shots.length?null:(h.pt!=null?h.pt:null),shots:h.shots.map(x=>({c:x.c,d:x.d,r:x.r||''}))}));
    rec.holeData=hs.some(hasHole)?hs:[];

/* ================= 홀별 샷 기록 ================= */
function isPutter(c){return c==='P'}
function clubLabel(c){return c==='P'?t('putter'):c}
function holeLabel(n){return S.lang==='ko'?n+t('hole'):'Hole '+n}
function clubs(){const c=(S.data.config||[]).find(x=>x.id==='main');const l=(c&&Array.isArray(c.clubs)&&c.clubs.length)?c.clubs:DEFAULT_CLUBS;return l.filter(x=>x&&!isPutter(x))}
async function saveClubs(){
  const l=document.getElementById('stClubs').value.split(/[,，\n]/).map(x=>x.trim()).filter(x=>x&&!/^(p|putter|퍼터)$/i.test(x));
  if(!l.length)return;
  const c=JSON.parse(JSON.stringify((S.data.config||[]).find(x=>x.id==='main')||{id:'main'}));c.clubs=l;
  await saveLocal('config',c);toast(t('saved'));openSettings();sync();
}
function coursePars(course){
  const o={};if(!course)return o;
  const r=S.data.rounds.filter(x=>x.course===course&&(x.holeData||[]).some(h=>h.par)).sort(byDateDesc)[0];
  if(r)r.holeData.forEach(h=>o[h.n]=h.par);return o;
}
function resizeHoles(hs,n,course){
  const pars=coursePars(course),out=[];
  for(let i=1;i<=n;i++){const h=(hs||[]).find(x=>x.n===i);out.push(h?{n:i,par:+h.par||4,pen:+h.pen||0,sc:h.sc!=null?+h.sc:null,pt:h.pt!=null?+h.pt:null,shots:(h.shots||[]).map(s=>({...s}))}:{n:i,par:pars[i]||4,pen:0,sc:null,pt:null,shots:[]})}
  return out;
}
function applyCoursePars(course){
  if(!F||!F.holes||F.holes.some(hasHole))return;
  const p=coursePars(course);if(!Object.keys(p).length)return;
  F.holes.forEach(h=>{if(p[h.n])h.par=p[h.n]});drawHoles();recalcSummary();
}
function hasHole(h){return (h.shots||[]).length>0||h.sc!=null}
function holeCalc(h){
  const sh=h.shots||[];
  if(!sh.length){if(h.sc==null)return null;const sc=+h.sc,pt=h.pt!=null?+h.pt:null;
    return{score:sc,putts:pt,firstPutt:null,onIn:pt!=null?sc-pt:null,gir:pt!=null?sc-pt<=(+h.par||4)-2:null,fw:null,quick:true}}
  let strokes=0,greenAt=null,putts=0,firstPutt=null;
  sh.forEach(s=>{
    if(isPutter(s.c)){putts++;if(firstPutt==null){firstPutt=s.d;if(greenAt==null)greenAt=strokes}strokes++}
    else{strokes++;if(s.r==='ob'||s.r==='haz')strokes++;if((s.r==='green'||s.r==='holed')&&greenAt==null)greenAt=strokes}
  });
  strokes+=(+h.pen||0);
  const par=+h.par||4,tee=sh[0];
  return{score:strokes,putts,firstPutt,onIn:greenAt,gir:greenAt!=null&&greenAt<=par-2,
    fw:par>=4&&tee&&!isPutter(tee.c)&&tee.r?tee.r==='fw':null};
}
function roundSummary(hs){
  const done=(hs||[]).filter(hasHole),res={done:done.length,total:(hs||[]).length};
  if(!hs||!hs.length||done.length!==hs.length)return res;
  let score=0,par=0,putts=0,gir=0,fw=0,fwH=0,tp=0,b=0,bo=0,db=0,pOK=true;const pp={3:[],4:[],5:[]};
  hs.forEach(h=>{const c=holeCalc(h),d=c.score-h.par;score+=c.score;par+=h.par;
    if(c.putts==null)pOK=false;else{putts+=c.putts;if(c.putts>=3)tp++}if(c.gir)gir++;
    if(c.fw!=null){fwH++;if(c.fw)fw++}if(d<=-1)b++;else if(d===1)bo++;else if(d>=2)db++;if(pp[h.par])pp[h.par].push(c.score)});
  const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)/100:null;
  return Object.assign(res,{complete:true,score,par,putts:pOK?putts:null,gir:pOK?gir:null,fairways:fwH?fw:null,fwHoles:fwH||null,threePutts:pOK?tp:null,birdies:b,bogeys:bo,doubles:db,p3:av(pp[3]),p4:av(pp[4]),p5:av(pp[5])});
}
function scCls(d){return d<=-1?'bird':d===1?'bog':d>=2?'dbl':''}
function chipHtml(h,i){const c=holeCalc(h);return `<button type="button" class="hchip ${i===F.hi?'on':''} ${c?'has '+scCls(c.score-h.par):''}" onclick="goHole(${i})">${h.n}<b>${c?c.score:'·'}</b></button>`}
function holeSumText(h){
  const c=holeCalc(h);if(!c)return `<span class="muted" style="font-weight:500">${t('noShotsYet')}</span>`;
  const d=c.score-h.par;
  return `<span class="${scCls(d)}" style="color:${d<=-1?'#d1453b':d===1?'var(--bl)':d>=2?'#7a3fb0':'inherit'}">${c.score}${S.lang==='ko'?'타':''} (${signed(d,0)})</span> · ${t('putts')} ${c.putts}${c.onIn!=null?' · '+t('onN',{n:c.onIn}):''}${c.gir?' · GIR ✓':''}`;
}
function shotRow(s,i){

   <button type="button" class="x" onclick="rmShot(${i})">×</button></div>`;
}
function drawHoles(){

function updHole(){

function rmShot(i){F.holes[F.hi].shots.splice(i,1);drawHoles();recalcSummary()}
function setShot(i,k,v){
  const s=F.holes[F.hi].shots[i];if(!s)return;

function recalcSummary(){
  const el=document.getElementById('autoNote'),f=document.getElementById('frm');if(!el||!f||!F||!F.holes)return;
  const sm=roundSummary(F.holes);
  if(sm.complete){
    ['score','par','putts','gir','fairways','fwHoles','threePutts','birdies','bogeys','doubles','p3','p4','p5'].forEach(k=>{if(f[k]&&sm[k]!=null)f[k].value=sm[k]});

  }else el.innerHTML=sm.done?`<div class="autonote part">${t('partial',{a:sm.done,b:sm.total})}</div>`:'';

function scorecardHtml(r){
  const hs=(r.holeData||[]).filter(hasHole);if(!hs.length)return '';
  const res=k=>t('r_'+k).replace(/ \(\+1\)/,'');
  return `<div class="sec">${t('scorecard')}</div><div class="card" style="padding:4px 12px">${hs.map(h=>{const c=holeCalc(h),d=c.score-h.par;
    return `<div class="schole"><div class="hn">${h.n}<small>P${h.par}</small></div><div class="hs ${scCls(d)}">${c.score}</div><div class="hshots">${c.quick?(c.putts!=null?'⛳ '+t('putts')+' '+c.putts:''):''}${h.shots.map(s=>isPutter(s.c)?`⛳${s.d!=null?' '+s.d:''}`:`<b>${esc(s.c)}</b>${s.d!=null?' '+s.d:''}${s.r?' <i>'+res(s.r)+'</i>':''}`).join(' → ')}${h.pen?` <span class="pen">+${h.pen}</span>`:''}</div></div>`}).join('')}</div>`;
}
function shotData(rounds){
  const cl={},pb={},ab={};let holes=0;
  rounds.forEach(r=>(r.holeData||[]).forEach(h=>{
    const sh=h.shots||[];if(!sh.length)return;holes++;const c=holeCalc(h);
    sh.forEach((s,i)=>{
      if(isPutter(s.c))return;
      if(s.d!=null&&s.d>0&&s.r!=='ob'){const o=cl[s.c]=cl[s.c]||{n:0,sum:0,max:0};o.n++;o.sum+=s.d;o.max=Math.max(o.max,s.d)}
      const app=!(i===0&&h.par>=4)&&!(h.par>=5&&i===1);
      if(app&&s.d!=null){const k=AB.findIndex(b=>s.d>=b[0]&&s.d<=b[1]);if(k>=0){const o=ab[k]=ab[k]||{n:0,on:0};o.n++;const nx=sh[i+1];
        if(s.r==='green'||s.r==='holed'||(!s.r&&nx&&isPutter(nx.c)))o.on++}}
    });
    if(c.firstPutt!=null){const k=PB.findIndex(b=>c.firstPutt>=b[0]&&c.firstPutt<=b[1]);if(k>=0){const o=pb[k]=pb[k]||{n:0,p:0,one:0,three:0};o.n++;o.p+=c.putts;if(c.putts===1)o.one++;if(c.putts>=3)o.three++}}
  }));
  return{cl,pb,ab,holes};
}
function shotStatsCard(range){
  const a=rangeStart(range);
  const d=shotData(S.data.rounds.filter(r=>inR(r.date,a,new Date(2100,0,1))));
  const head=`<h3>🎯 ${t('shotStats')}${d.holes?`<small>${t('shotStatsSub',{n:d.holes})}</small>`:''}</h3>`;
  if(!d.holes)return `<section class="card">${head}<div class="empty small">${t('noShots')}</div></section>`;
  const order=[...clubs(),...Object.keys(d.cl).filter(c=>clubs().indexOf(c)<0)].filter(c=>d.cl[c]);
  const mx=Math.max(1,...order.map(c=>d.cl[c].sum/d.cl[c].n));
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
  const rng=(b,u)=>b[1]>=999?b[0]+'+':b[0]+'–'+b[1];
  return `<section class="card">${head}
   <div class="sec" style="margin-top:0">${t('clubDist')}</div>
   <table class="st"><tr><th></th><th></th><th>${t('avg')}</th><th>${t('max')}</th><th>${t('cnt')}</th></tr>
   ${order.map(c=>{const o=d.cl[c],av=o.sum/o.n;return `<tr><td><b>${esc(c)}</b></td><td class="bar"><div class="track"><i style="width:${av/mx*100}%;background:var(--teal)"></i></div></td><td><b>${Math.round(av)}</b></td><td>${o.max}</td><td class="muted">${o.n}</td></tr>`}).join('')}</table>
   ${Object.keys(d.pb).length?`<div class="sec">⛳ ${t('puttDist')} (${t('paces')})</div>
   <table class="st"><tr><th></th><th>${t('holesC')}</th><th>${t('avgPutts')}</th><th>${t('onePutt')}</th><th>${t('threePutt')}</th></tr>
   ${PB.map((b,k)=>{const o=d.pb[k];if(!o)return '';return `<tr><td><b>${rng(b)}</b></td><td class="muted">${o.n}</td><td>${(o.p/o.n).toFixed(1)}</td><td class="up">${pct(o.one,o.n)}</td><td class="${o.three?'down':''}">${pct(o.three,o.n)}</td></tr>`}).join('')}</table>`:''}
   ${Object.keys(d.ab).length?`<div class="sec">🚩 ${t('approach')} (${t('yd')})</div>
   <table class="st"><tr><th></th><th>${t('cnt')}</th><th class="bar"></th><th>${t('onGreen')}</th></tr>
   ${AB.map((b,k)=>{const o=d.ab[k];if(!o)return '';return `<tr><td><b>${rng(b)}</b></td><td class="muted">${o.n}</td><td class="bar"><div class="track"><i style="width:${o.on/o.n*100}%;background:var(--g)"></i></div></td><td><b>${pct(o.on,o.n)}</b></td></tr>`}).join('')}</table>`:''}
  </section>`;
}

function normClub(c){
  c=String(c==null?'':c).trim();if(!c)return '';
  if(/^(p|putt|putter|퍼터|퍼트)$/i.test(c))return 'P';
  if(/^(d|dr|driver|드라이버)$/i.test(c))return 'D';
  const cl=clubs(),hit=cl.find(x=>x.toLowerCase()===c.toLowerCase())||cl.find(x=>x.replace('°','')===c.replace(/[°도]/g,''));
  return hit||c;
}
function impDup(r){return S.data.rounds.some(x=>x.date===r.date&&(x.kind||'practice')===(r.kind||'practice')&&(x.score==null||r.score==null||x.score===r.score))}
function buildRound(raw){
  const kind=raw.kind==='tournament'?'tournament':'practice';
  const hd=(raw.holeData||[]).map(h=>({n:+h.n,par:+h.par||4,pen:0,sc:h.sc!=null&&h.sc!==''?+h.sc:null,pt:h.pt!=null&&h.pt!==''?+h.pt:null,
    shots:(h.shots||[]).map(x=>({c:normClub(x.c),d:x.d!=null&&x.d!==''?+x.d:null,r:RES.indexOf(x.r)>=0?x.r:''})).filter(x=>x.c)})).filter(h=>h.n>=1&&h.n<=18);
  const holes=+raw.holes===9||(!raw.holes&&hd.length&&Math.max(...hd.map(h=>h.n))<=9)?9:18;
  let tour=raw.tour||'';if(tour&&TOURS.indexOf(tour)<0)tour=t('other');
  const rec={kind,tour:kind==='tournament'?tour:'',event:kind==='tournament'?(raw.event||''):'',course:raw.course||'',date:raw.date||today(),holes,finished:raw.finished!==false,
    par:raw.par!=null?+raw.par:(holes===9?36:72),fwHoles:raw.fwHoles!=null?+raw.fwHoles:(holes===9?7:14),place:raw.place!=null?String(raw.place):'',link:'',media:[],
    notes:[raw.division?(t('division')+': '+raw.division):'',raw.notes||''].filter(Boolean).join('\n')};
  ['score','putts','gir','fairways','threePutts','field'].forEach(k=>rec[k]=raw[k]!=null&&raw[k]!==''?+raw[k]:null);
  if(hd.some(hasHole)){
    rec.holeData=resizeHoles(hd,holes,rec.course);
    const sm=roundSummary(rec.holeData);
    if(sm.complete)['score','par','putts','gir','fairways','fwHoles','threePutts','birdies','bogeys','doubles','p3','p4','p5'].forEach(k=>{if(sm[k]!=null)rec[k]=sm[k]});
  }else rec.holeData=[];
  if(kind==='tournament'){const ev=allEvents().find(e=>e.kind==='tournament'&&e.date===rec.date&&!e.roundId);if(ev){rec.eventId=ev.id;rec.link=ev.link||'';if(!rec.event)rec.event=ev.title||''}}
  return rec;
}

     <div class="small muted">${[r.event&&r.course?esc(r.course):'',r.holes+'H',r.place?'#'+esc(r.place):''].filter(Boolean).join(' · ')}</div>
     <div class="row" style="margin-top:6px;gap:14px"><b style="font-size:20px">${r.score!=null?r.score:'–'}</b><span class="muted">${tp!=null?signed(tp,0):''}</span>
      <span class="small muted">${[r.putts!=null?t('putts')+' '+r.putts:'',nh?t('impHoles',{n:nh}):'',ns?t('impShots',{n:ns}):''].filter(Boolean).join(' · ')}</span></div>
     ${unclear.length?`<div class="warn">⚠️ ${unclear.map(esc).join('<br>⚠️ ')}</div>`:''}
     ${!it.done&&impDup(r)?`<div class="warn dup">⚠️ ${t('impDup')}</div>`:''}
     <div style="margin-top:8px">${it.done?`<span class="up">✅ ${t('impSaved')}</span>`:`<button class="btn" style="width:100%" onclick="impEdit(${i})">${t('impCheck')}</button>`}</div></div>`}).join('');
  ft.innerHTML=`<button class="btn sec" onclick="impReset()">${t('impAgain')}</button><button class="btn" ${left?'':'disabled'} onclick="impSaveAll()">${t('impAll')}</button>`;
}
async function impPick(input){

async function impMedia(rec){
  if(IMP.items.length!==1||!IMP.imgs.length)return;
  for(const b64 of IMP.imgs){
    const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const blob=new Blob([u],{type:'image/jpeg'}),lid='lm_'+uid(),name=rec.date+'_'+(IMP.mode==='note'?'note':'bluegolf')+'.jpg';
    await idb.put('media',lid,{blob,mime:'image/jpeg',name,size:blob.size,created:Date.now()});rec.media.push({local:lid,mime:'image/jpeg',name});
  }
}

async function impSaveAll(){
  for(const it of IMP.items){

const LVL_NAMES=[['🐣','Rookie'],['🏌️','Range Rat'],['🎯','Chip Champ'],['⛳','Putt Pro'],['🦅','Par Hunter'],['🐦','Birdie Seeker'],['👁️','Eagle Eye'],['🌟','Albatross'],['🏆','Tour Ready'],['👑','Major Contender'],['🐐','Legend']];
let Q=null,QSAVE=null,QTIMER=null;
function qhash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296}}
function qIcon(q){return q.src==='hw'?'🎓':q.src==='ai'?'🤖':(QCATI[q.cat]||'⭐')}
function qid8(d){return 'q_'+d.replace(/-/g,'')}
function todayQ(){return (S.data.quests||[]).find(r=>r.id===qid8(today()))}
function lvlStart(n){let x=0;for(let i=1;i<n;i++)x+=100+50*(i-1);return x}
function lvlOf(xp){let n=1;while(xp>=lvlStart(n+1))n++;return n}
function lvlName(n){const a=LVL_NAMES[Math.min(n,LVL_NAMES.length)-1];return a[0]+' '+a[1]+(n>LVL_NAMES.length?' ★'+(n-LVL_NAMES.length):'')}
function recXP(r){return (r.items||[]).reduce((a,q)=>a+(q.done?(+q.xpEarned||0):0),0)+(+r.streakBonus||0)+(r.perfect?30:0)}
function totalXP(){return (S.data.quests||[]).reduce((a,r)=>a+recXP(r),0)+coachXPAll()}
function doneDays(){const s=new Set((S.data.quests||[]).filter(r=>(r.items||[]).some(q=>q.done)).map(r=>r.date));S.data.practice.forEach(p=>{if(p.coach&&Object.values(p.coach).some(c=>c&&c.done))s.add(p.date)});return s}
function streakNow(){const s=doneDays();let n=0,d=new Date();if(!s.has(ymd(d)))d=addDays(d,-1);for(let k=0;k<400;k++){const x=ymd(d);if(s.has(x))n++;else if(!offDay(x))break;d=addDays(d,-1)}return n}
/* 토·일, 대회 있는 날 = 연습 계획·퀘스트 없음 */
function offDay(d){const w=pd(d).getDay();if(w===0||w===6)return true;return allEvents().some(e=>e.kind==='tournament'&&e.date===d)}
function bestStreak(){const ds=[...doneDays()].sort();let best=0,cur=0,prev=null;ds.forEach(x=>{cur=prev&&ymd(addDays(pd(prev),1))===x?cur+1:1;best=Math.max(best,cur);prev=x});return best}
function hwQuests(){
  const out=[];S.data.lessons.slice().sort(byDateDesc).forEach(l=>(l.homework||[]).forEach(h=>{if(h.done)return;
        out.push({qid:'hw_'+h.id,src:'hw',cat:'routine',type:'check',target:1,xp:60,title:{ko:h.text,en:h.text},how:{ko:h.target||'선생님 숙제',en:h.target||'Coach homework'}})}));
  return out;
}
function aiQuests(){
  const a=S.analyses.find(x=>x.kind==='full'&&x.result&&Array.isArray(x.result.quests));
  if(!a||(Date.now()-new Date(a.created||a.date).getTime())>14*864e5)return [];
  return a.result.quests.filter(q=>q&&QTYPES[q.type]&&QCATI[q.cat]).map((q,i)=>({qid:'ai_'+String(a.id).slice(-8)+'_'+i,src:'ai',cat:q.cat,type:q.type,target:Math.max(1,Math.min(60,+q.target||5)),of:q.of?Math.max(+q.target||1,Math.min(30,+q.of)):undefined,xp:Math.max(20,Math.min(100,+q.xp||40)),title:q.title,how:q.how}));
}
function weakCats(){
  const a=S.analyses.find(x=>x.kind==='full'&&x.result&&x.result.gaps);
  const fromAI=a?a.result.gaps.map(g=>({mental:'routine',course:'routine'})[g.area]||g.area).filter(c=>QCATI[c]):[];
  const ct=catTot(S.data.practice.filter(p=>inR(p.date,addDays(new Date(),-7),new Date())));
  const low=['putt','chip','wedge','iron','driver','bunker'].sort((x,y)=>(ct[x]||0)-(ct[y]||0));
  return [...new Set([...fromAI,...low])];
}
function pickQuests(date,exclude){
  const rnd=qhash(date+'|'+S.player),pick=l=>l.length?l[Math.floor(rnd()*l.length)]:null;
  const used=new Set(exclude||[]),cats=new Set(),out=[];
  const add=q=>{if(!q||used.has(q.qid)||out.length>=3)return;used.add(q.qid);if(q.cat!=='routine')cats.add(q.cat);out.push(q)};
  add(pick(hwQuests().filter(q=>!used.has(q.qid))));
  const wk=weakCats(),ai=aiQuests().filter(q=>!used.has(q.qid));
  add(pick(ai.filter(q=>wk.slice(0,2).indexOf(q.cat)>=0))||pick(ai));
  for(const c of wk){if(out.length>=3)break;if(cats.has(c))continue;add(pick(QPOOL.filter(q=>q.cat===c&&!used.has(q.qid))))}
  let guard=0;while(out.length<3&&guard++<50){const q=pick(QPOOL.filter(x=>!used.has(x.qid)&&!(x.type==='practice'&&out.some(o=>o.type==='practice'))&&!cats.has(x.cat)))||pick(QPOOL.filter(x=>!used.has(x.qid)));add(q)}
  return out.map(q=>({...JSON.parse(JSON.stringify(q)),prog:0,made:0,att:0,run:0,best:0,res:[],done:false,xpEarned:0,sec:0}));
}

/* 자동 진행 (템포·연습 시간) */
function autoProg(q){
  const td=today(),ps=S.data.practice.filter(p=>p.date===td);
  if(q.type==='practice')return sumMin(ps);
  if(q.type==='tempo')return ps.reduce((a,p)=>a+(p.tempo||[]).reduce((b,x)=>b+(+x.reps||0),0),0)+(TS&&TS.running?TS.reps:0);
  if(q.type==='minutes')return Math.floor(((+q.sec||0)+(q.tStart?(Date.now()-q.tStart)/1000:0))/60);
  return q.prog||0;
}
function qProgText(q){
  if(q.type==='drill')return (q.made||0)+'/'+q.target+' · '+(q.att||0)+'/'+q.of;
  if(q.type==='streak')return (q.run||0)+'/'+q.target+(q.best?' · '+t('qBest')+' '+q.best:'');
  if(q.type==='check')return q.done?'✓':'0/1';
  const p=Math.min(q.target,autoProg(q));return p+'/'+q.target+(q.type==='minutes'||q.type==='practice'?(S.lang==='ko'?'분':'m'):'');
}
function qPct(q){if(q.done)return 100;if(q.type==='drill')return Math.min(100,(q.made||0)/q.target*100);if(q.type==='streak')return Math.min(100,(q.run||0)/q.target*100);if(q.type==='check')return 0;return Math.min(100,autoProg(q)/q.target*100)}

function qStarted(q){return (q.att||0)>0||(q.prog||0)>0||(q.sec||0)>0||!!q.tStart}

function qHit(ok){
  const q=curQ();if(!q||q.done)return;
  if(q.type==='streak'){q.att=(q.att||0)+1;if(ok){q.run=(q.run||0)+1;q.best=Math.max(q.best||0,q.run);sfx('tick')}else{q.run=0;Q.shake=true;sfx('miss')}

    if(q.made>=q.target)return completeQuest(q)}
  vib(ok?12:[30,40,30]);drawQuest();qPersist();
}
function qRetry(){const q=curQ();if(!q)return;q.tries=(q.tries||0)+1;q.res=[];q.made=0;q.att=0;drawQuest();qPersist()}
function qCount(d){const q=curQ();if(!q||q.done)return;q.prog=Math.max(0,(q.prog||0)+d);Q.pop=d>0;if(d>0){sfx('tick');vib(10)}if(q.prog>=q.target)return completeQuest(q);drawQuest();qPersist()}
function qCheck(){const q=curQ();if(q&&!q.done){q.prog=1;completeQuest(q)}}
function qTimer(){const q=curQ();if(!q||q.done)return;if(q.tStart){q.sec=(+q.sec||0)+(Date.now()-q.tStart)/1000;q.tStart=null}else q.tStart=Date.now();drawQuest();qPersist()}

function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
let SFX=null;
function sfx(kind){
  if(ls('qmute'))return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;SFX=SFX||new AC();if(SFX.state==='suspended')SFX.resume();
    const now=SFX.currentTime,tone=(f,st,d,type,v)=>{const o=SFX.createOscillator(),g=SFX.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,now+st);g.gain.exponentialRampToValueAtTime(v||0.25,now+st+0.01);g.gain.exponentialRampToValueAtTime(0.0001,now+st+d);o.connect(g);g.connect(SFX.destination);o.start(now+st);o.stop(now+st+d+0.02)};
    if(kind==='tick')tone(880,0,0.08);
    else if(kind==='miss')tone(160,0,0.18,'sawtooth',0.12);
    else if(kind==='clear')[523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.18));
    else if(kind==='level')[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.08,0.25,'square',0.12));
  }catch(e){}
}

function confetti(){
  if(RM)return;const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,x=c.getContext('2d');
  const cols=['#c6ef5e','#2bb5a0','#ef8a25','#5b70d8','#ffd23f','#ff5d8f','#ffffff'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.45,vx:(Math.random()-.5)*W*.022,vy:-Math.random()*H*.028-H*.006,s:(6+Math.random()*8)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(n){const dt=Math.min(32,n-(f.l||n))/16;f.l=n;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=H*.0009*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(n-t0<2200)requestAnimationFrame(f);else c.remove()})(t0);
}

const TP={full:[[18,6],[21,7],[24,8],[27,9],[30,10]],putt:[[14,7],[16,8],[18,9],[20,10],[22,11]]};
let TS=null;
function fmtClock(s){return Math.floor(s/60)+':'+pad(s%60)}
function tCur(){const [b,d]=TP[TS.mode][TS.idx[TS.mode]];return{b,d}}
function openTempo(){

  drawTempo();

function drawTempo(){
  const box=document.getElementById('tempoBox');if(!box||!TS)return;const {b,d}=tCur();
  box.innerHTML=`<div class="tempo">
   <div class="seg tmode">${['full','putt'].map(m=>`<button class="${TS.mode===m?'on':''}" onclick="tempoMode('${m}')">${t('t_'+m)}</button>`).join('')}</div>

   <div class="tset"><button class="icon" onclick="tempoStep(-1)">−</button><div class="v"><b>${(b/30).toFixed(2)}s · ${(d/30).toFixed(2)}s</b><small>${t('tBack')} · ${t('tDown')}</small></div><button class="icon" onclick="tempoStep(1)">+</button></div>
   <div class="small muted">${t('tFaster')}</div>

   <button class="addbtn" style="margin-top:8px" onclick="tempoToggle()">${TS.running?'⏸ '+t('tStop'):'▶ '+t('tStart')}</button>
   <div class="tstats"><div><b id="tReps">${TS.reps}</b><span>${t('tReps')}</span></div><div><b id="tTime">${fmtClock(TS.sec)}</b><span>${t('tTime')}</span></div></div>
   <div class="note">${t('tHow')}</div></div>`;
}
function tempoMode(m){TS.mode=m;ls('tMode',m);drawTempo()}
function tempoStep(d){const k=TS.mode;TS.idx[k]=Math.max(0,Math.min(TP[k].length-1,TS.idx[k]+d));ls('tIdx_'+k,TS.idx[k]);drawTempo()}
function tempoRest(d){TS.rest=Math.max(2,Math.min(15,TS.rest+d));ls('tRest',TS.rest);drawTempo()}
function tBeep(at,freq,dur){
  const c=TS.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(0.7,at+0.005);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+dur+0.02);TS.osc.push(o);o.onended=()=>{if(TS)TS.osc=TS.osc.filter(x=>x!==o)};
}
function tFlash(at,cls,label){
  const ms=Math.max(0,(at-TS.ctx.currentTime)*1000);
  setTimeout(()=>{if(!TS||!TS.running)return;const r=document.getElementById('tRing'),p=document.getElementById('tPhase');if(!r)return;
    r.className='tring '+cls;if(p)p.textContent=label;setTimeout(()=>{r.className='tring'},130)},ms);
}
async function tempoToggle(){if(TS.running)tempoStop();else await tempoStart();drawTempo()}
async function tempoStart(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast(t('err'));return}
  if(!TS.ctx)TS.ctx=new AC();try{await TS.ctx.resume()}catch(e){}
  TS.running=true;TS.next=TS.ctx.currentTime+1.0;TS.t0=Date.now()-TS.sec*1000;
  TS.timer=setInterval(tempoTick,40);
  try{if(navigator.wakeLock)TS.wake=await navigator.wakeLock.request('screen')}catch(e){}
}
function tempoTick(){
  if(!TS||!TS.running)return;const c=TS.ctx;
  TS.sec=Math.floor((Date.now()-TS.t0)/1000);const tt=document.getElementById('tTime');if(tt)tt.textContent=fmtClock(TS.sec);
  if(TS.next-c.currentTime<0.25){
    const {b,d}=tCur(),st=Math.max(TS.next,c.currentTime+0.05),top=st+b/30,imp=top+d/30,mode=TS.mode,set=b+'/'+d;
    tBeep(st,660,0.09);tBeep(top,880,0.09);tBeep(imp,1320,0.13);
    tFlash(st,'b1',t('tAway'));tFlash(top,'b2',t('tTop'));tFlash(imp,'b3',t('tImpact'));
    setTimeout(()=>{if(!TS||!TS.running)return;TS.reps++;TS.log.push({mode,set});const r=document.getElementById('tReps');if(r)r.textContent=TS.reps},Math.max(0,(imp-c.currentTime)*1000));
    TS.next=imp+TS.rest;
  }
}
function tempoStop(){
  if(!TS)return;TS.running=false;clearInterval(TS.timer);TS.timer=null;
  TS.osc.forEach(o=>{try{o.stop()}catch(e){}});TS.osc=[];
  if(TS.wake){TS.wake.release().catch(()=>{});TS.wake=null}
}
function tempoLog(){
  if(!TS)return;tempoStop();
  const reps=TS.reps,sec=TS.sec,log=TS.log;
  if(!reps){closeSheet();return}
  const g={};log.forEach(x=>{const k=x.mode+'|'+x.set;g[k]=(g[k]||0)+1});
  const keys=Object.keys(g);
  const drills=keys.map(k=>{const [m,set]=k.split('|');return{cat:m==='putt'?'putt':'iron',name:'🎵 Tempo '+set+(m==='putt'?' (2:1)':' (3:1)'),made:null,att:g[k]}});
  const mins=Math.max(1,Math.round(sec/60)),byCat={};drills.forEach(d=>byCat[d.cat]=(byCat[d.cat]||0)+d.att);
  const items=Object.keys(byCat).map(c=>({cat:c,min:Math.max(1,Math.round(mins*byCat[c]/reps)),balls:null}));
  const tpl={date:today(),items,drills,tempo:keys.map(k=>{const [m,set]=k.split('|');return{mode:m,set,reps:g[k]}}),notes:''};
  closeSheet();openForm('practice',null,tpl);
}
