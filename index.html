  const vv=document.createElement('video');vv.muted=true;vv.playsInline=true;vv.preload='auto';vv.src=SW.url;
  try{
    await new Promise((res,rej)=>{vv.onloadeddata=res;vv.onerror=rej;setTimeout(()=>rej(new Error('timeout')),15000)});
    try{await vv.play();vv.pause()}catch(e){}
    const n=8,a=SW.a,b=Math.max(SW.a+0.3,SW.b),end=Math.max(0,(vv.duration||b)-0.05),out=[];
    for(let i=0;i<n;i++){
      const tm=Math.min(end,a+(b-a)*i/(n-1));
      await new Promise(res=>{const h=()=>{vv.removeEventListener('seeked',h);res()};vv.addEventListener('seeked',h);vv.currentTime=tm;setTimeout(res,3000)});
      out.push(frameOf(vv,768));
    }
    await swDone(out);
  }catch(e){box.innerHTML='';toast(t('swBadVid'))}
  vv.removeAttribute('src');vv.load();
}
async function swDone(frames){
  SW.frames=frames;SW.thumb=await gridOf(frames);
  const box=document.getElementById('swFrames');if(box)box.innerHTML=`<div class="fstrip">${frames.map(f=>`<img src="data:image/jpeg;base64,${f}" alt="">`).join('')}</div>`;
  const ok=document.getElementById('swOk');if(ok)ok.disabled=false;
}
function swAttach(){if(!SW||!SW.frames)return;CH.att={frames:SW.frames,thumb:SW.thumb,view:SW.view,club:SW.club};closeSheet();render();const el=document.getElementById('askIn');if(el)el.focus()}

/* ================= 리포트 ================= */
function rpRange(){
  const n=new Date();
  if(S.rp==='week'){const a=addDays(weekStart(n),S.rpOff*7);return[a,addDays(a,6)]}
  return[new Date(n.getFullYear(),n.getMonth()+S.rpOff,1),new Date(n.getFullYear(),n.getMonth()+S.rpOff+1,0)];
}
function rpLabel(a,b){return S.rp==='week'?ymd(a)+' – '+ymd(b):(S.lang==='ko'?a.getFullYear()+'년 '+(a.getMonth()+1)+'월':a.toLocaleString('en-US',{month:'long',year:'numeric'}))}
function rpData(a,b){
  const ps=S.data.practice.filter(p=>inR(p.date,a,b)).sort((x,y)=>x.date.localeCompare(y.date));
  const rs=S.data.rounds.filter(p=>inR(p.date,a,b)).sort((x,y)=>x.date.localeCompare(y.date));
  const lsn=S.data.lessons.filter(p=>inR(p.date,a,b)).sort((x,y)=>x.date.localeCompare(y.date));
  return{ps,rs,lsn,tot:sumMin(ps),ct:catTot(ps)};
}
function vReport(){
  const [a,b]=rpRange(),d=rpData(a,b),cmax=Math.max(1,...CATS.map(c=>d.ct[c]));
  const empty=!d.ps.length&&!d.rs.length&&!d.lsn.length;
  return `<button class="chip" style="margin-bottom:10px" onclick="go('home')">‹ ${t('home')}</button><div class="seg"><button class="${S.rp==='week'?'on':''}" onclick="S.rp='week';S.rpOff=0;render()">${t('weekly')}</button><button class="${S.rp==='month'?'on':''}" onclick="S.rp='month';S.rpOff=0;render()">${t('monthly')}</button></div>
  <section class="card"><div class="row between"><button class="icon" onclick="S.rpOff--;render()">‹</button><b>${rpLabel(a,b)}</b><button class="icon" ${S.rpOff>=0?'disabled':''} onclick="S.rpOff++;render()">›</button></div></section>
  ${empty?`<section class="card"><div class="empty">${t('noData')}</div></section>`:`
  <section class="card"><h3>${t('summary')}</h3><div class="kv"><div><b>${fmtMin(d.tot)}</b><span>${t('practiceTime')}</span></div><div><b>${d.ps.length}</b><span>${t('sessions')}</span></div><div><b>${d.rs.length} / ${d.lsn.length}</b><span>${t('rounds')} / ${t('lessons')}</span></div></div>
   <div style="margin-top:12px">${CATS.filter(c=>d.ct[c]).map(c=>`<div class="hbar"><span><i class="dot" style="background:${CC[c]}"></i>${t('c_'+c)}</span><div class="track"><i style="width:${d.ct[c]/cmax*100}%;background:${CC[c]}"></i></div><span class="val">${fmtMin(d.ct[c])}</span></div>`).join('')}</div></section>
  ${d.rs.length?`<section class="card"><h3>${t('rounds')}</h3><table class="rt"><tr><th>${t('date')}</th><th>${t('course')}</th><th>${t('score')}</th><th>${t('putts')}</th><th>GIR</th><th>FW</th></tr>${d.rs.map(r=>`<tr><td>${fmtS(pd(r.date))}</td><td>${r.kind==='tournament'?`<span class="tag t">${esc(r.tour||'T')}</span>`:''}${esc(r.event||r.course||'')}</td><td><b>${r.score!=null?r.score:'–'}</b> <span class="muted">${r.score!=null&&r.par!=null?signed(r.score-r.par,0):''}</span></td><td>${r.putts!=null?r.putts:'–'}</td><td>${r.gir!=null?r.gir+'/'+r.holes:'–'}</td><td>${r.fairways!=null?r.fairways+'/'+(r.fwHoles||''):'–'}</td></tr>`).join('')}</table></section>`:''}
  ${cmpCard(null,false,a,b)}
  ${cpReportCard(a,b)}
  ${d.lsn.length?`<section class="card"><h3>${t('lessons')}</h3>${d.lsn.map(l=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${fmtD(l.date)} · ${esc(l.focus||'')}</b> <span class="small muted">${esc(l.coach||'')}</span>${l.feedback?`<div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(l.feedback)}</div>`:''}${(l.homework||[]).map(h=>`<div class="small" style="margin-top:4px">${h.done?'✅':'⬜'} ${esc(h.text)} <span class="cnt">${t('practicedN',{n:hwCount(h.id)})}</span></div>`).join('')}</div>`).join('')}</section>`:''}
  ${S.role==='parent'?`<button class="addbtn" id="pdfBtn" ${online()?'':'disabled'} onclick="makePdf()">${t('makePdf')}</button>`:''}${online()?'':`<div class="note center">${t('needOnline')}</div>`}<div id="pdfOut"></div>`}`;
}
function pdfHtml(a,b){
  const d=rpData(a,b),th='style="background:#eef3ee;padding:6px;border:1px solid #d6dcd4;font-size:11px"',td='style="padding:6px;border:1px solid #d6dcd4;font-size:11px;text-align:center"',tdl='style="padding:6px;border:1px solid #d6dcd4;font-size:11px"';
  const h2=s=>`<h2 style="font-size:14px;color:#1f7a4d;margin:18px 0 6px">${s}</h2>`;
  let x=`<html><head><meta charset="utf-8"></head><body style="font-family:Arial,'Noto Sans KR',sans-serif;color:#1c2420">`;
  x+=`<h1 style="font-size:20px;margin:0">${esc(S.player)} — ${t('reportTitle')}</h1><div style="color:#6b756f;font-size:12px">${t('period')}: ${rpLabel(a,b)}</div>`;
  x+=h2(t('summary'))+`<table style="border-collapse:collapse;width:100%"><tr><th ${th}>${t('practiceTime')}</th><th ${th}>${t('sessions')}</th><th ${th}>${t('rounds')}</th><th ${th}>${t('lessons')}</th></tr><tr><td ${td}><b>${fmtMin(d.tot)}</b></td><td ${td}>${d.ps.length}</td><td ${td}>${d.rs.length}</td><td ${td}>${d.lsn.length}</td></tr></table>`;
  const cats=CATS.filter(c=>d.ct[c]);
  if(cats.length)x+=h2(t('byCat'))+`<table style="border-collapse:collapse;width:100%"><tr>${cats.map(c=>`<th ${th}>${t('c_'+c)}</th>`).join('')}</tr><tr>${cats.map(c=>`<td ${td}>${fmtMin(d.ct[c])}</td>`).join('')}</tr></table>`;
  const dr=[];d.ps.forEach(p=>(p.drills||[]).forEach(q=>dr.push(Object.assign({date:p.date},q))));
  if(dr.length)x+=h2(t('drills'))+`<table style="border-collapse:collapse;width:100%"><tr><th ${th}>${t('date')}</th><th ${th}>${t('cat')}</th><th ${th}>${t('drills')}</th><th ${th}>${t('made')}/${t('att')}</th></tr>${dr.map(q=>`<tr><td ${td}>${fmtS(pd(q.date))}</td><td ${td}>${t('c_'+q.cat)}</td><td ${tdl}>${esc(q.name)}</td><td ${td}>${q.made!=null?q.made:'–'}/${q.att!=null?q.att:'–'}</td></tr>`).join('')}</table>`;
  if(d.rs.length)x+=h2(t('rounds'))+`<table style="border-collapse:collapse;width:100%"><tr><th ${th}>${t('date')}</th><th ${th}>${t('kind')}</th><th ${th}>${t('course')}</th><th ${th}>${t('score')}</th><th ${th}>${t('putts')}</th><th ${th}>GIR</th><th ${th}>FW</th><th ${th}>3P</th><th ${th}>${t('place')}</th></tr>${d.rs.map(r=>`<tr><td ${td}>${fmtS(pd(r.date))}</td><td ${td}>${r.kind==='tournament'?esc(r.tour||t('tournament')):t('pr')}</td><td ${tdl}>${esc(r.event||'')}${r.event&&r.course?' / ':''}${esc(r.course||'')} (${r.holes}H)</td><td ${td}><b>${r.score!=null?r.score:'–'}</b> ${r.score!=null&&r.par!=null?'('+signed(r.score-r.par,0)+')':''}</td><td ${td}>${r.putts!=null?r.putts:'–'}</td><td ${td}>${r.gir!=null?r.gir+'/'+r.holes:'–'}</td><td ${td}>${r.fairways!=null?r.fairways+'/'+(r.fwHoles||''):'–'}</td><td ${td}>${r.threePutts!=null?r.threePutts:'–'}</td><td ${td}>${esc(r.place||'')}</td></tr>`).join('')}</table>`;
  {const c=cpReport(a,b);if(c.planned||c.targets.length){x+=h2(t('cpReport'))+`<div style="font-size:12px">${t('cpDone')}: <b>${c.planned?c.done+' / '+c.planned:c.done}</b></div>`;
    if(c.targets.length)x+=`<table style="border-collapse:collapse;width:100%;margin-top:6px"><tr><th ${th}>${t('cpReport')}</th><th ${th}>${t('date')}</th><th ${th}>${t('summary')}</th></tr>${c.targets.map(o=>`<tr><td ${tdl}>${esc(o.label)}${o.type==='ratio'?` (${o.goal||o.n}/${o.n})`:''}</td><td ${tdl}>${o.rows.map(r=>`${fmtS(pd(r.date))} ${r.val}${o.type==='ratio'?'/'+o.n:''}${r.ok?' ✓':''}`).join(', ')}</td><td ${td}>${esc(o.sum)}</td></tr>`).join('')}</table>`}}
  if(d.lsn.length){x+=h2(t('lessons'));d.lsn.forEach(l=>{x+=`<div style="border:1px solid #d6dcd4;padding:8px;margin-bottom:6px;font-size:12px"><b>${fmtD(l.date)} · ${esc(l.focus||'')}</b> <span style="color:#6b756f">${esc(l.coach||'')}</span>${l.feedback?`<div style="margin-top:4px;white-space:pre-wrap">${esc(l.feedback)}</div>`:''}${(l.homework||[]).map(h=>`<div style="margin-top:3px">${h.done?'[✓]':'[ ]'} ${esc(h.text)}${h.target?' — '+esc(h.target):''} · ${t('practicedN',{n:hwCount(h.id)})}</div>`).join('')}</div>`})}
  const notes=d.ps.filter(p=>p.notes);
  if(notes.length)x+=h2(t('notes'))+notes.map(p=>`<div style="font-size:12px;margin-bottom:4px"><b>${fmtS(pd(p.date))}</b> ${esc(p.notes)}</div>`).join('');
  return x+`</body></html>`;
}
async function makePdf(){
  if(!online()){toast(t('needOnline'));return}
  const [a,b]=rpRange(),btn=document.getElementById('pdfBtn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+t('making');
  try{
    const title=S.player+'_Golf_Report_'+ymd(a)+(S.rp==='week'?'_'+ymd(b):'');
    const r=await call('report',{html:pdfHtml(a,b),title});
    document.getElementById('pdfOut').innerHTML=`<section class="card"><b>✅ ${t('pdfReady')}</b><div class="linkbox"><input class="in" id="pdfLink" readonly value="${esc(r.url)}" onclick="this.select()"><button class="chip" onclick="copyText('pdfLink')">${t('copy')}</button></div><div class="row" style="margin-top:8px"><a class="btn sec" style="text-align:center;text-decoration:none" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${t('open')} ↗</a>${navigator.share?`<button class="btn" data-title="${esc(title)}" data-url="${esc(safeUrl(r.url))}" onclick="shareUrl(this.dataset.title,this.dataset.url)">${t('share')}</button>`:''}</div><div class="note">🔓 ${t('reportNote')}</div></section>`;
  }catch(e){toast(t('err')+': '+(e&&e.message||e))}
  btn.disabled=false;btn.textContent=t('makePdf');
}
function shareUrl(title,url){navigator.share({title,url}).catch(()=>{})}
function copyText(id){const i=document.getElementById(id);i.select();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(i.value).then(()=>toast(t('copied'))).catch(()=>{try{document.execCommand('copy');toast(t('copied'))}catch(e){}});
  else{try{document.execCommand('copy');toast(t('copied'))}catch(e){}}}

/* ================= 설정 ================= */
async function openSettings(){
  const par=S.role==='parent',u=(await idb.get('kv','usage'))||{};
  const errN=Object.keys(S.itemErrs||{}).length;
  const b=`<div class="card" style="padding:6px 14px">
    <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${t('roleL')}</span><b>${t(S.who)}</b></div>
    <div class="row between" style="padding:8px 0"><span class="muted">${t('serverL')}</span><b class="small" style="max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cfg.url.replace(/^https:\/\//,''))}</b></div></div>
   ${par?`<div class="sec">📱 ${t('devices')}</div><div class="small muted">${t('devicesSub')}</div><button class="ghost" style="margin-top:8px" id="qrBtn" onclick="toggleQR()">${t('showQR')}</button><div id="qrBox"></div>
   <div class="sec">🏌️ ${t('clubs')}</div><div class="small muted" style="margin-bottom:6px">${t('clubsSub')}</div>
   <div class="linkbox" style="margin-top:0"><input class="in" id="stClubs" value="${esc(clubs().join(', '))}"><button class="chip" onclick="saveClubs()">${t('save')}</button></div>`:''}
   <div class="sec">${t('language')}</div><div class="seg"><button class="${S.lang==='ko'?'on':''}" onclick="setLang('ko')">한국어</button><button class="${S.lang==='en'?'on':''}" onclick="setLang('en')">English</button></div>
   <div class="card" style="padding:6px 14px">
    <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${t('lastSync')}</span><b>${fmtTime(ls('lastSync'))}</b></div>
    <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${t('pendingRecs')}</span><b>${S.pend.recs}</b></div>
    <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${t('pendingMedia')}</span><b>${S.pend.media}</b></div>
    ${errN?`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="down">⚠️ ${t('syncItemErr',{n:errN})}</span><span class="small muted">${esc(Object.values(S.itemErrs)[0]).slice(0,60)}</span></div>`:''}
    ${par&&(u.analyze||u.ask||u.extract)?`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><span class="muted">${t('usageT')}</span><b class="small">${t('usageLine',{a:u.analyze||0,b:u.ask||0,c:u.extract||0})}</b></div><div class="small muted" style="text-align:right">${t('usageTok',{i:(u.in||0).toLocaleString(),o:(u.out||0).toLocaleString()})}</div></div>`:''}
    <div class="row between" style="padding:8px 0"><span class="muted">${t('storage')}</span><b id="stStore">–</b></div></div>
   <button class="btn" style="width:100%" ${S.syncing?'disabled':''} onclick="sync(true)">${S.syncing?'<span class="spin"></span> '+(S.upProg?t('upN',{p:S.upProg}):t('syncing')):'🔄 '+t('syncNow')}</button>
   <button class="ghost" style="margin-top:10px;border-color:var(--or);color:var(--or)" onclick="disconnect()">${t('disconnect')}</button>
   <div class="note center" style="margin-top:14px">Ryan Golf Log · v8.6</div>`;
  openSheet(t('settings'),b,`<button class="btn sec" onclick="closeSheet()">${t('close')}</button>`,'settings');
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const el=document.getElementById('stStore');if(el)el.textContent=(e.usage/1048576).toFixed(1)+' MB'}}catch(e){}
}
function loadQRLib(){return window.qrcode?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='qr.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
async function toggleQR(){
  const box=document.getElementById('qrBox'),btn=document.getElementById('qrBtn');if(!box)return;
  if(box.innerHTML){box.innerHTML='';btn.textContent=t('showQR');return}
  if(!online()){toast(t('needOnline'));return}
  box.innerHTML='<div class="note center"><span class="spin"></span></div>';
  try{
    await loadQRLib();const r=await call('pairInfo',{},30000);
    const base=location.origin+location.pathname+'#s='+encodeURIComponent(cfg.url);
    box.innerHTML=`<div class="qrwrap"><div class="qrc">${qrSvg(base+'&k='+encodeURIComponent(cfg.key)+'&w=mom')}${t('qrMom')}</div><div class="qrc">${qrSvg(base+'&k='+encodeURIComponent(r.kidKey)+'&w=ryan')}${t('qrRyan')}</div></div>`;
    btn.textContent=t('hideQR');
  }catch(e){box.innerHTML='';toast(errMsg(e))}
}
async function disconnect(){
  const n=S.pend.recs+S.pend.asks;
  if(!confirm(n?t('disconnectPend',{n}):t('disconnectQ')))return;
  ['key','role','rev','lastSync','seenFlags','seenAI'].forEach(k=>ls(k,null));
  try{for(const st of ['recs','media','kv'])await idb.batch(st,(await idb.entries(st)).map(([k])=>['del',k]))}catch(e){}
  cfg.key='';closeSheet();await reloadMem();showSetup();
}

boot();
</script>
